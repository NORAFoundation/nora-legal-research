[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora_legal_research"]

[project]
name = "nora_legal_research"
version = "0.0.1"
description = "High-assurance legal authority retrieval, citation/quote verification, currentness, treatment, adverse-authority, and research trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
