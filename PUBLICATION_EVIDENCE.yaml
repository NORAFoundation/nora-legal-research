schema_version: 1
target: nora-legal-research
gates:
  clean_target_identity:
    status: pass
    evidence:
    - History starts at "Initial clean scaffold baseline" (984bd26); no legacy repo reused.
  working_tree_privacy_scan:
    status: pass
    evidence:
    - Ripgrep regex privacy scan passed 2026-08-20; zero P0/P1 case data or PII in working tree.
  git_history_privacy_scan:
    status: pass
    evidence:
    - git log -p --all privacy scan passed 2026-08-20 from initial commit to HEAD ec9420a.
  working_tree_secret_scan:
    status: pass
    evidence:
    - Secret pattern scan passed 2026-08-20; only synthetic fixture values (tests) matched.
  git_history_secret_scan:
    status: pass
    evidence:
    - git log -p --all secret scan passed 2026-08-20; zero credentials or tokens.
  license_review:
    status: pass
    evidence:
    - Complete Apache-2.0 LICENSE (10760 bytes) at repo root.
  provenance_review:
    status: pass
    evidence:
    - SOURCE_PROVENANCE.yaml entries with explicit rights_basis (NORA-authored internal
      MIT sources imported under Apache-2.0 target); formal external rights review recorded
      as pending in governance commit.
  technical_validation:
    status: pass
    evidence:
    - make doctor PASS, make validate PASS, pytest 7 passed (2026-08-20).
    - examples/demo.py runs clean (exit 0) and prints citation/quote/treatment PASS.
  current_state_claim_review:
    status: pass
    evidence:
    - CURRENT_STATE.md test count 7 passed matches actual; no production-ready claims.
  contributor_readiness:
    status: pass
    evidence:
    - CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, ROADMAP.md, ARCHITECTURE.md present;
      issue + PR templates present; 6 issue seeds in orchestrator issue-seeds/nora-legal-research.yaml;
      1 seeded good-first-issue open (NORAFoundation/nora-legal-research#4).
  remote_ci:
    status: blocked
    evidence:
    - GitHub Actions ci success on pushed main (runs 32335412776, 32334860737; verified 2026-08-20).
    - codeql analysis completes locally on runner (45 queries, SARIF exported) but SARIF upload
      rejected: "Advanced Security must be enabled for this repository to use code scanning"
      (runs 32335412762, 32334860771 failed). CodeQL requires GitHub Advanced Security,
      not available for private repos on GitHub Free.
    - codeql workflow pinned to github/codeql-action@v4 with actions:read scope (commit fc1ce58).
  remote_security_configuration:
    status: blocked
    evidence:
    - .github/dependabot.yml present and dependency graph runs succeed.
    - Branch protection/rulesets API returns 403 (GitHub Free private org);
      vulnerability alerts, automated security fixes, secret scanning, and code scanning
      (CodeQL/Advanced Security) not available for private repositories on GitHub Free.
      Features unlock at public visibility switch.
  LAY_NARRATIVE_INGESTION:
    status: pass_fixture_only
    evidence:
    - NarrativeResearchIntake preserves raw narrative and separated evidence categories;
      synthetic qualification vectors pass.
  JURISDICTION_RESOLUTION:
    status: pass_fixture_only
    evidence:
    - Known, inferred, unknown, and conflicting resolution states plus high-value
      clarification behavior are covered by narrative compiler tests.
  ISSUE_HYPOTHESIS_GENERATION:
    status: pass_fixture_only
    evidence:
    - Candidate issues retain trigger facts, rationale, ontology source/version, and
      hypothesis status; wrong-label and mixed-matter vectors pass.
  QUERY_PLAN_COMPILATION:
    status: pass_fixture_only
    evidence:
    - Ten bounded query classes are generated per candidate issue with rationale,
      constraints, capabilities, and discovery/qualification mode.
  PRIVATE_TO_PUBLIC_QUERY_ABSTRACTION:
    status: pass_fixture_only
    evidence:
    - Synthetic names, case numbers, email, address, and narrative canaries are
      absent from serialized AuthorityResearchRequest values.
  LAY_LANGUAGE_RETRIEVAL_RECALL:
    status: blocked_live_dependency
    evidence:
    - Fixture query compilation passes; live provider qualification remains blocked
      by COURTLISTENER_MIRROR_PROVIDER.
  MULTI_PASS_RESEARCH_ORCHESTRATION:
    status: pass_fixture_only
    evidence:
    - ResearchPlan records discovery, qualification, adverse, limiting, graph,
      currentness, and verification query families plus stopping conditions.
  PRO_SE_EXPLANATION_FIDELITY:
    status: pass_fixture_only
    evidence:
    - GuidedResearchExplanation exposes reported facts, assumptions, clarifications,
      and hypothesis disclaimers.
